    --g004hex: #202020; --panel: #292929;

    --star-on: #CCA634; --star-off: rgba(255,255,255,.6); --star-off-op: .6;

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }

/* ---------- 站頭 ---------- */

/* ---------- 搜尋 ---------- */
.search-wrapper { display: flex; align-items: center; padding: 20px 16px; margin-bottom: 6px; background: var(--g004); }

  -webkit-appearance: none; appearance: none; outline: none;
}

#q::-webkit-search-cancel-button, #q::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
.btn-search { position: absolute; right: 11px; top: 9px; width: 22px; height: 22px; color: var(--b093); }
.btn-search.no-ring:focus-visible { outline: none; }

  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
}

/* ---------- 左:查詢條件 ---------- */
.item-wrapper { display: block; }
.filter-wrapper {
  position: fixed; top: -9999px; left: -9999px; width: 100%; height: 100%; padding: 40px 16px;

}

.filter-title h2 { font-size: 18px; line-height: 24px; color: var(--b093); }
.btn-reset { width: 22px; height: 24px; margin-left: 4px; color: var(--b045); display: flex; align-items: center; justify-content: center; }

.filter-body { flex: 1 1 auto; overflow-y: auto; padding: 0 20px 20px; }
.btn-save { flex: 0 0 48px; width: 100%; height: 48px; font-size: 15px; color: #FFFFFF; background: var(--point); border-radius: 0 0 5px 5px; }
.fsec { border: 1px solid var(--g008); margin-bottom: 10px; }
.fsec > header { height: 44px; padding: 10px 16px 13px; background: var(--g004); color: var(--b068); font-size: 14px; }
.forms { display: flex; flex-wrap: wrap; padding: 20px 16px 3px; }
.chk { position: relative; width: 49%; margin-bottom: 15px; padding-left: 22px; font-size: 14px; line-height: 21px; color: var(--b093); cursor: pointer; }
.chk input { position: absolute; left: 0; top: 2px; width: 16px; height: 16px; margin: 0; opacity: 0; cursor: pointer; }
.chk .box { position: absolute; left: 0; top: 2px; width: 16px; height: 16px; border: 1px solid var(--chk-off); border-radius: 1.5px; pointer-events: none; }
.chk input:checked + .box { background: var(--chk-on); border-color: var(--chk-on); border-radius: 2px; }
.chk input:checked + .box::after {
  content: ""; position: absolute; left: 4.5px; top: 1.5px; width: 5px; height: 9px;
  border: solid var(--chk-mark); border-width: 0 1.6px 1.6px 0; transform: rotate(40deg);
}
.chk input:focus-visible + .box { outline: 2px solid var(--point-text); outline-offset: 1px; }
.tree-art { padding: 8px 16px 15px; }
.tree-all { display: block; width: 100%; padding: 12px 0; text-align: left; font-size: 14px; color: var(--b093); }
#tree { border-top: 1px solid var(--g010); padding-top: 5px; }
#tree li { padding: 6px 0; }
#tree button { display: inline-flex; align-items: center; vertical-align: top; font-size: 14px; line-height: 21px; text-align: left; color: var(--b093); }
#tree li li button { color: var(--b068); }
#tree button::before { content: ""; flex: 0 0 auto; }
#tree li[data-has-child] > button::before {
  width: 6px; height: 6px; border: solid var(--g020); border-width: 0 2px 2px 0;
  transform: rotate(-40deg) skew(10deg); margin: 0 10px 0 0;
}
#tree li:not([data-has-child]) > button::before { width: 3px; height: 3px; background: var(--g020); margin: 0 6px 0 0; }
#tree li > ul { display: none; }

#tree li li.is-active > ul { margin: 6px 0 0 20px; }
#tree > li.is-active > button { margin-bottom: 6px; }
#tree > li.is-active > button::before { border-color: var(--b093); transform: rotate(50deg) skew(10deg); margin: -5px 7px 0 3px; }
#tree li li.is-active > button { color: var(--point-text); }
#tree li li.is-active[data-has-child] > button::before { border-color: var(--point); transform: rotate(50deg) skew(10deg); margin: -5px 7px 0 3px; }
#tree li li.is-active:not([data-has-child]) > button::before { background: var(--point); }

/* ---------- 右:結果 ---------- */
.result-wrapper { display: flow-root; font-size: 15px; min-width: 0; }
.result-util { display: flex; justify-content: space-between; align-items: center; padding: 0 16px; margin-top: 10px; font-size: 14px; }
.result-util .title { height: 34px; line-height: 30px; color: var(--b068); }

.star-btn { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }

.tbl { border-top: 1px solid var(--g040); }
.tr { display: flex; align-items: center; border-bottom: 1px solid var(--g008); position: relative; }
.thead { height: 48px; justify-content: center; font-size: 14px; color: var(--b068); }
.thead .c-fav, .thead .c-reg, .thead .c-lv, .thead .c-form { display: none; }
.thead .c-name, .thead .c-drop { flex: 0 0 auto; }
.thead .c-drop::before { content: "/"; margin: 0 1px 0 2px; }
.tbody .tr { min-height: 57px; padding: 5px 0; }
.tbody .tr:hover { background: var(--g002); }
.c-fav { flex: 0 0 50px; padding-left: 16px; }
.c-name { flex: 0 0 calc(100% - 60px); min-width: 0; }
.c-reg, .c-lv, .c-form { display: none; }
.tbody .c-drop {
  position: absolute; left: 106px; top: 30px; width: calc(100% - 120px); font-size: 13px; line-height: 20px;
  color: var(--drop-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.c-reg .nw { white-space: nowrap; }
.btn-item { display: flex; align-items: flex-start; width: 100%; text-align: left; }
.btn-item img { flex: 0 0 46px; width: 46px; height: 46px; margin-right: 10px; object-fit: contain; }
.btn-item .nm { min-width: 0; font-size: 15px; line-height: 22px; color: var(--b093); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.nodata { padding: 100px 16px; font-size: 15px; color: var(--b068); text-align: center; border-top: 1px solid var(--g040); }

/* 分頁 */
.pager { display: none; }
.pager-m { margin-top: 30px; text-align: center; color: var(--b045); font-size: 15px; }
.pager-m .row1 { display: flex; justify-content: center; }

.pager-m select option { background: var(--panel); color: var(--b093); }

/* ---------- 明細彈窗 ---------- */
.dw { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; padding: 40px 16px; background: rgba(0,0,0,.8); z-index: 9100009; display: none; }
.dw.is-active { display: block; }
.dlg { position: relative; max-height: 90vh; max-height: 90dvh; overflow-y: auto; border-radius: 5px; font-size: 14px; background: var(--panel); color: var(--b093); outline: none; }
.dlg-title { position: relative; height: 62px; padding-top: 21px; margin: 0 35px 0 20px; display: flex; align-items: flex-start; color: var(--b068); }
.dlg-title h2 { font-size: 18px; line-height: 22px; color: var(--b093); }
.btn-back { position: relative; width: 11px; height: 22px; margin-right: 8px; }
.btn-back::after { content: ""; position: absolute; left: 3px; top: 5px; width: 12px; height: 12px; border: solid var(--b068); border-width: 0 1px 1px 0; transform: rotate(135deg); }
.btn-share { width: 22px; height: 22px; margin: 0 0 0 4px; color: var(--b068); }
.btn-share svg { width: 22px; height: 22px; }
.btn-close { position: absolute; top: 12px; right: -24px; width: 35px; height: 35px; }
.btn-close::before, .btn-close::after { content: ""; position: absolute; left: 50%; top: 50%; width: 19px; height: 1px; margin-left: -9.5px; background: var(--b068); }
.btn-close::before { transform: rotate(45deg); }
.btn-close::after { transform: rotate(-45deg); }
.dlg-body { position: relative; padding: 0 10px 10px 20px; margin-right: 6px; }
.dcol section { margin-bottom: 10px; }
.summary { position: relative; display: flow-root; border-top: 1px solid var(--g040); padding: 16px 0 7px; }
.summary .thumb { float: left; width: 50px; height: 50px; margin-right: 12px; border: 1px solid var(--g012); object-fit: contain; }
.summary .mname { margin-top: 6px; padding-right: 40px; font-size: 16px; line-height: 22px; color: var(--text); word-break: break-all; }
.summary .mname strong { font-weight: 400; }
.ability { font-size: 14px; color: var(--b045); display: flex; flex-wrap: wrap; }
.ability span { position: relative; padding-left: 5px; margin-right: 5px; }
.ability span:first-child { padding-left: 0; }
.ability span + span::before { content: ""; position: absolute; left: 0; top: 4px; width: 1px; height: 14px; background: var(--sep); }
.summary .star-btn { position: absolute; right: 12px; top: 23px; }
.dsec > header { display: flex; align-items: center; height: 46px; padding: 0 4px 0 16px; background: var(--g004); border-top: 1px solid var(--g008); color: var(--b068); white-space: nowrap; }
.dsec > header h3 { font-size: 14px; font-weight: 400; }
.btn-folder { position: relative; width: 35px; height: 35px; margin-left: auto; }
.btn-folder::after { content: ""; position: absolute; left: 13px; top: 15px; width: 9px; height: 9px; border: solid var(--b068); border-width: 0 1px 1px 0; transform: rotate(-135deg); }
.dsec.is-folded .btn-folder::after { transform: rotate(45deg); top: 10px; }
.dsec.is-folded > article { display: none; }
.dsec > article { padding: 16px 16px 0; }
.kv li, .drops li { display: flex; padding-bottom: 13px; }

.item-link { text-align: left; }

.cat-key::before { content: ""; flex: 0 0 auto; width: 6px; height: 6px; margin: 5px 8px 0 2px; border: solid var(--b093); border-width: 0 2px 2px 0; transform: rotate(50deg) skew(10deg); }

.drop-cat.is-hidden .v { display: none; }

/* ---------- 浮動 ---------- */
.theme-toggle {
  position: fixed; left: 16px; bottom: 16px; z-index: 100; height: 40px; padding: 0 14px 0 8px; border-radius: 22px;
  display: flex; align-items: center; background: #434343; border: 1px solid #585858; box-shadow: 0 2px 4px rgba(0,0,0,.25); opacity: .95;
}
.theme-toggle svg { width: 26px; height: 26px; }
.theme-toggle span { margin-left: 2px; font-size: 14px; font-weight: 700; letter-spacing: -.7px; color: rgba(255,255,255,.6); }
:root[data-theme="dark"] .theme-toggle span { color: var(--point-text); }
.to-top {
  position: fixed; right: 16px; bottom: 16px; z-index: 100; width: 33px; height: 33px; border-radius: 4px;
  border: 1px solid var(--g008); background: var(--g004hex); color: var(--b068); display: flex; align-items: center; justify-content: center;
}
.to-top svg { width: 13px; height: 17px; }
.toast {
  position: fixed; left: 50%; bottom: 16px; z-index: 9999999; transform: translateX(-50%);

  display: flex; align-items: center; justify-content: center; text-align: center;

}
.toast.show { animation: toast-in .2s ease-out; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
@media (prefers-reduced-motion: reduce) { .toast.show { animation: none; } }

  .tbody .tr { min-height: 54px; padding: 4px 0; }
  .tr .c-fav { display: block; flex: 0 0 50px; }
  .tr .c-name { display: block; flex: 0 0 185px; }
  .tr .c-reg { display: block; flex: 0 0 140px; }
  .tr .c-lv { display: block; flex: 0 0 70px; }
  .tr .c-form { display: block; flex: 0 0 90px; }
  .tbody .c-reg, .tbody .c-lv, .tbody .c-form { text-align: center; color: var(--b045); padding: 0 4px; }
  .tr .c-drop { flex: 1 1 0; min-width: 0; }
  .tbody .c-drop { position: static; width: auto; padding-left: 12px; font-size: 13px; }
  .btn-item { align-items: center; }
  .nodata { padding: 100px 0; }

    }
    info.art.appendChild(kv);
    left.appendChild(info.sec);

    var dsec = section('掉落道具', 'drops-sec'), ul = el('ul', 'drops');
    if (!m.drops.length) ul.appendChild(el('li', 'no-data', '-'));
    m.drops.forEach(function (c) {
      var li2 = el('li', 'drop-cat'), k = el('button', 'k cat-key', c.cat), v2 = el('div', 'v');
      k.type = 'button';
      k.setAttribute('aria-expanded', 'true');
      c.items.forEach(function (it) {
        var p = el('p'), b = el('button', 'item-link');
        b.type = 'button';
        b.setAttribute('data-item', it);
        b.appendChild(el('strong', '', it));
        p.appendChild(b);
        v2.appendChild(p);
      });
      li2.appendChild(k);
      li2.appendChild(v2);
      ul.appendChild(li2);
    });
    dsec.art.appendChild(ul);
    right.appendChild(dsec.sec);
    dlgBody.appendChild(left);
    dlgBody.appendChild(right);
    syncCatKeys();
  }
  function syncCatKeys() { // 桌機分類名不可點 → 不給 Tab 停
    var ks = dlgBody.querySelectorAll('.cat-key');
    for (var i = 0; i < ks.length; i++) ks[i].tabIndex = mqMobile.matches ? 0 : -1;
  }
  function renderDetail(st) {
    if (!st.detail) {
      if (!detailOpen) return;
      detailOpen = false;
      detailKey = '';
      dw.classList.remove('is-active');
      lockScroll();
      var lf = lastFocus;
      lastFocus = null;
      if (lf && document.contains(lf)) lf.focus();
      else if (lf && lf.getAttribute && lf.getAttribute('data-key')) { // 清單重畫過,找同一隻的新按鈕
        var k = lf.getAttribute('data-key'), btns = tbody.querySelectorAll('.btn-item');
        for (var i = 0; i < btns.length; i++) if (btns[i].getAttribute('data-key') === k) { btns[i].focus(); break; }
      }
      return;
    }
    if (detailKey !== st.detail) {
      buildDetail(BYKEY[st.detail]);
      detailKey = st.detail;
      dlg.scrollTop = 0;
      dlgBody.scrollTop = 0;
    }
    if (!detailOpen) {
      detailOpen = true;
      if (!lastFocus) lastFocus = document.activeElement;
      dw.classList.add('is-active');
      lockScroll();
      dlg.focus();
    }
  }
  function updateDetailStar() {
    var s = dlgBody.querySelector('.detail-star');
    if (!s) return;
    var on = isFav(detailKey);
    s.classList.toggle('on', on);
    s.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  function closeDetail() { nav({ detail: '' }); }
  $('dlgClose').addEventListener('click', closeDetail);
  $('dlgBack').addEventListener('click', function () {
    if (!useHash && histDepth() > 0) history.back(); else closeDetail();
  });
  var downOnBackdrop = false; // 在彈窗內按下、拖到遮罩放開(選字)不算點遮罩
  dw.addEventListener('pointerdown', function (e) { downOnBackdrop = e.target === dw; });
  dw.addEventListener('click', function (e) {
    if (e.target === dw && downOnBackdrop) closeDetail();
    downOnBackdrop = false;
  });
  dlgBody.addEventListener('click', function (e) {
    var it = e.target.closest('[data-item]');
    if (it) {
      lastFocus = null;
      nav({ detail: '', query: it.getAttribute('data-item'), exactsearch: 'true', page: '1', forms: '', region1: '', region2: '', region3: '', favorite: '' });
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    var f = e.target.closest('.btn-folder');
    if (f) {
      var sec = f.closest('.dsec'), folded = sec.classList.toggle('is-folded');
      f.setAttribute('aria-expanded', folded ? 'false' : 'true');
      return;
    }
    var k = e.target.closest('.cat-key');
    if (k && mqMobile.matches) {
      var hidden = k.parentNode.classList.toggle('is-hidden');
      k.setAttribute('aria-expanded', hidden ? 'false' : 'true');
    }
  });
  $('dlgShare').addEventListener('click', function () {
    var url = location.href;
    if (mqMobile.matches && navigator.share) {
      navigator.share({ title: document.title, url: url }).catch(function () {});
      return;
    }
    copyText(url).then(function () { toast('已複製地址。'); }, function () { toast(url); });
  });
  function copyText(t) {
    function legacy() {
      return new Promise(function (res, rej) {
        var ta = el('textarea');
        ta.value = t;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        if (ok) res(); else rej();
      });
    }
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).catch(legacy);
    return legacy();
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      if (detailOpen) { e.preventDefault(); closeDetail(); }
      else if (filterOpen) { setFilter(false); $('btnFilter').focus(); }
      return;
    }
    if (e.key === 'Tab' && (detailOpen || filterOpen)) { // 焦點鎖在彈窗內
      var box = detailOpen ? dlg : filterEl;
      var f = Array.prototype.filter.call(box.querySelectorAll('button, input, select, a[href], [tabindex]'), function (x) { return !x.disabled && x.tabIndex >= 0 && x.getClientRects().length > 0; });
      if (!f.length) return;
      var first = f[0], lastEl = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === box)) { e.preventDefault(); lastEl.focus(); }
      else if (!e.shiftKey && document.activeElement === lastEl) { e.preventDefault(); first.focus(); }
      else if (!box.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    }
  });

  // ================================================= 主題/回頂/toast
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    $('themeTxt').textContent = t === 'dark' ? 'ON' : 'OFF';
    $('btnTheme').setAttribute('aria-pressed', t === 'dark' ? 'true' : 'false');
  }
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
  $('btnTheme').addEventListener('click', function () {
    var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    sset(THEME_KEY, t);
    applyTheme(t);
  });
  function onScheme() {
    var t = sget(THEME_KEY);
    if (t !== 'dark' && t !== 'light') applyTheme(mqDark.matches ? 'dark' : 'light');
  }
  if (mqDark.addEventListener) mqDark.addEventListener('change', onScheme); else if (mqDark.addListener) mqDark.addListener(onScheme);

  var btnTop = $('btnTop');
  function onScroll() { btnTop.hidden = window.pageYOffset < 200; }
  window.addEventListener('scroll', onScroll, { passive: true });
  btnTop.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });

  var toastEl = $('toast'), toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    toastEl.classList.remove('show');
    void toastEl.offsetWidth;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 3000);
  }

  render(true);
  onScroll();
})();
</script>
</body>
</html>
