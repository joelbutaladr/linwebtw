<style>
:root {
  --bg: #FFFFFF; --text: #000000;
  --b093: rgba(0,0,0,.93); --b068: rgba(0,0,0,.68); --b045: rgba(0,0,0,.45);
  --g002: rgba(34,34,34,.02); --g004: rgba(34,34,34,.04); --g008: rgba(34,34,34,.08); --g010: rgba(34,34,34,.1);
  --g012: rgba(34,34,34,.12); --g020: rgba(34,34,34,.2); --g040: rgba(34,34,34,.4);
  --g004hex: #F6F6F6; --panel: #FFFFFF;
  --point: #B93B1D; --point-text: #B93B1D; --on-toast: #FFFFFF; --toast-bg: rgba(0,0,0,.95);
  --link: #497EDF; --star-on: #FFD042; --star-off: rgba(0,0,0,.68); --star-off-op: .3;
  --chk-off: rgba(34,34,34,.2); --chk-on: #333333; --chk-mark: #FFFFFF;
  --drop-text: rgba(0,0,0,.45); --sep: rgba(34,34,34,.12); --thumb: rgba(0,0,0,.45);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171717; --text: #FFFFFF;
    --b093: rgba(255,255,255,.83); --b068: rgba(255,255,255,.6); --b045: rgba(255,255,255,.38);
    --g002: rgba(255,255,255,.02); --g004: rgba(255,255,255,.04); --g008: rgba(255,255,255,.08); --g010: rgba(255,255,255,.1);
    --g012: rgba(255,255,255,.12); --g020: rgba(255,255,255,.2); --g040: rgba(255,255,255,.4);
    --g004hex: #202020; --panel: #292929;
    --point: #8D341F; --point-text: #A4422B; --on-toast: #000000; --toast-bg: rgba(255,255,255,.95);
    --star-on: #CCA634; --star-off: rgba(255,255,255,.6); --star-off-op: .6;
    --chk-off: rgba(255,255,255,.2); --chk-on: #D7D7D7; --chk-mark: #000000;
    --drop-text: rgba(255,255,255,.83); --sep: rgba(255,255,255,.12); --thumb: rgba(255,255,255,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171717; --text: #FFFFFF;
  --b093: rgba(255,255,255,.83); --b068: rgba(255,255,255,.6); --b045: rgba(255,255,255,.38);
  --g002: rgba(255,255,255,.02); --g004: rgba(255,255,255,.04); --g008: rgba(255,255,255,.08); --g010: rgba(255,255,255,.1);
  --g012: rgba(255,255,255,.12); --g020: rgba(255,255,255,.2); --g040: rgba(255,255,255,.4);
  --g004hex: #202020; --panel: #292929;
  --point: #8D341F; --point-text: #A4422B; --on-toast: #000000; --toast-bg: rgba(255,255,255,.95);
  --star-on: #CCA634; --star-off: rgba(255,255,255,.6); --star-off-op: .6;
  --chk-off: rgba(255,255,255,.2); --chk-on: #D7D7D7; --chk-mark: #000000;
  --drop-text: rgba(255,255,255,.83); --sep: rgba(255,255,255,.12); --thumb: rgba(255,255,255,.6);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 16px/1.5 "Noto Sans TC", "Noto Sans", "Microsoft JhengHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
body.scroll-lock { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
ul { list-style: none; margin: 0; padding: 0; }
h1, h2, h3, p { margin: 0; font-weight: 400; }
img { display: block; }
:focus-visible { outline: 2px solid var(--point-text); outline-offset: 1px; }
svg { display: block; }

/* ---------- 站頭 ---------- */
.site-head { border-bottom: 1px solid var(--g008); padding: 0 16px; }
.site-head .inner { max-width: 1180px; margin: 0 auto; height: 56px; display: flex; align-items: center; }
.site-head .brand { font-size: 20px; color: var(--point-text); letter-spacing: .06em; }
.site-head h1 { font-size: 16px; color: var(--b093); display: flex; align-items: center; }
.site-head h1::before { content: ""; width: 1px; height: 14px; background: var(--g012); margin: 0 12px; }
.site-head h1 a { color: inherit; text-decoration: none; }

/* ---------- 版面 ---------- */
.section-contents { padding: 0 0 96px; }
.wrap-contents { max-width: 1180px; margin: 0 auto; }

/* ---------- 搜尋 ---------- */
.search-wrapper { display: flex; align-items: center; padding: 20px 16px; margin-bottom: 6px; background: var(--g004); }
.btn-filter { flex: 0 0 40px; width: 40px; height: 40px; margin-right: 10px; border: 1px solid var(--g012); border-radius: 4px; background: var(--bg); color: var(--b068); display: flex; align-items: center; justify-content: center; }
.btn-filter svg { width: 22px; height: 22px; }
#autoSuggest { position: relative; flex: 1 1 auto; max-width: 600px; margin: 0 auto; z-index: 11; min-width: 0; }
#q {
  display: block; width: 100%; height: 40px; padding: 6px 66px 6px 10px; font-size: 16px;
  border: 1px solid var(--g012); border-radius: 4px; background: var(--bg); color: var(--b093);
  -webkit-appearance: none; appearance: none; outline: none;
}
#q:focus { border-color: var(--g040); }
#q::placeholder { color: var(--b045); opacity: 1; }
#q::-webkit-search-cancel-button, #q::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
.btn-search { position: absolute; right: 11px; top: 9px; width: 22px; height: 22px; color: var(--b093); }
.btn-search.no-ring:focus-visible { outline: none; }
.btn-clear { position: absolute; right: 40px; top: 8px; width: 22px; height: 22px; color: var(--b045); }
.btn-search svg, .btn-clear svg { width: 22px; height: 22px; }
#suggest {
  position: absolute; left: 0; top: 100%; width: 100%; margin-top: -1px; padding: 4px 0;
  border: 1px solid var(--g012); border-radius: 4px; background: var(--bg); overflow: hidden;
}
#suggest li {
  height: 36px; padding: 7px 16px; font-size: 15px; line-height: 22px; color: var(--b068); text-align: left;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
}
#suggest li.focus { background: var(--g004); }
#suggest mark { color: var(--point-text); background: transparent; }

/* ---------- 左:查詢條件 ---------- */
.item-wrapper { display: block; }
.filter-wrapper {
  position: fixed; top: -9999px; left: -9999px; width: 100%; height: 100%; padding: 40px 16px;
  background: rgba(0,0,0,.8); visibility: hidden; z-index: -1; font-size: 14px;
}
.filter-wrapper.is-active { top: 0; left: 0; visibility: visible; z-index: 9999990; }
.filter-panel { display: flex; flex-direction: column; height: 100%; background: var(--panel); border-radius: 5px; overflow: hidden; }
.filter-title { flex: 0 0 62px; height: 62px; padding: 21px 16px 0; display: flex; align-items: flex-start; }
.filter-title h2 { font-size: 18px; line-height: 24px; color: var(--b093); }
.btn-reset { width: 22px; height: 24px; margin-left: 4px; color: var(--b045); display: flex; align-items: center; justify-content: center; }
.btn-reset svg { width: 13px; height: 13px; }
.filter-body { flex: 1 1 auto; overflow-y: auto; padding: 0 20px 20px; }
.btn-save { flex: 0 0 48px; width: 100%; height: 48px; font-size: 15px; color: #FFFFFF; background: var(--point); border-radius: 0 0 5px 5px; }
.fsec { border: 1px solid var(--g008); margin-bottom: 10px; }
.fsec > header { height: 44px; padding: 10px 16px 13px; background: var(--g004); color: var(--b068); font-size: 14px; }
.forms { display: flex; flex-wrap: wrap; padding: 20px 16px 3px; }
.chk { position: relative; width: 49%; margin-bottom: 15px; padding-left: 22px; font-size: 14px; line-height: 21px; color: var(--b093); cursor: pointer; }
.chk input { position: absolute; left: 0; top: 2px; width: 16px; height: 16px; margin: 0; opacity: 0; cursor: pointer; }
.chk .box { position: absolute; left: 0; top: 2px; width: 16px; height: 16px; border: 1px solid var(--chk-off); border-radius: 1.5px; pointer-events: none; }
.chk input:checked + .box { background: var(--chk-on); border-color: var(--chk-on); border-radius: 2px; }
.chk input:checked + .box::after {
  content: ""; position: absolute; left: 4.5px; top: 1.5px; width: 5px; height: 9px;
  border: solid var(--chk-mark); border-width: 0 1.6px 1.6px 0; transform: rotate(40deg);
}
.chk input:focus-visible + .box { outline: 2px solid var(--point-text); outline-offset: 1px; }
.tree-art { padding: 8px 16px 15px; }
.tree-all { display: block; width: 100%; padding: 12px 0; text-align: left; font-size: 14px; color: var(--b093); }
#tree { border-top: 1px solid var(--g010); padding-top: 5px; }
#tree li { padding: 6px 0; }
#tree button { display: inline-flex; align-items: center; vertical-align: top; font-size: 14px; line-height: 21px; text-align: left; color: var(--b093); }
#tree li li button { color: var(--b068); }
#tree button::before { content: ""; flex: 0 0 auto; }
#tree li[data-has-child] > button::before {
  width: 6px; height: 6px; border: solid var(--g020); border-width: 0 2px 2px 0;
  transform: rotate(-40deg) skew(10deg); margin: 0 10px 0 0;
}
#tree li:not([data-has-child]) > button::before { width: 3px; height: 3px; background: var(--g020); margin: 0 6px 0 0; }
#tree li > ul { display: none; }
#tree li.is-active > ul { display: block; margin-left: 26px; }
#tree li li.is-active > ul { margin: 6px 0 0 20px; }
#tree > li.is-active > button { margin-bottom: 6px; }
#tree > li.is-active > button::before { border-color: var(--b093); transform: rotate(50deg) skew(10deg); margin: -5px 7px 0 3px; }
#tree li li.is-active > button { color: var(--point-text); }
#tree li li.is-active[data-has-child] > button::before { border-color: var(--point); transform: rotate(50deg) skew(10deg); margin: -5px 7px 0 3px; }
#tree li li.is-active:not([data-has-child]) > button::before { background: var(--point); }

/* ---------- 右:結果 ---------- */
.result-wrapper { display: flow-root; font-size: 15px; min-width: 0; }
.result-util { display: flex; justify-content: space-between; align-items: center; padding: 0 16px; margin-top: 10px; font-size: 14px; }
.result-util .title { height: 34px; line-height: 30px; color: var(--b068); }
.result-util em { font-style: normal; color: var(--b093); }
.result-util strong { font-weight: 400; }
.btn-favview { display: flex; align-items: center; color: var(--b068); font-size: inherit; }
.btn-favview svg { width: 22px; height: 22px; margin: -2px 4px 0 0; }
.ic-star { fill: none; stroke: var(--star-off); stroke-width: 1.3; stroke-linejoin: round; opacity: var(--star-off-op); }
.on .ic-star { fill: var(--star-on); stroke: var(--star-on); opacity: 1; }
.star-btn { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
.star-btn svg { width: 22px; height: 22px; }

.tbl { border-top: 1px solid var(--g040); }
.tr { display: flex; align-items: center; border-bottom: 1px solid var(--g008); position: relative; }
.thead { height: 48px; justify-content: center; font-size: 14px; color: var(--b068); }
.thead .c-fav, .thead .c-reg, .thead .c-lv, .thead .c-form { display: none; }
.thead .c-name, .thead .c-drop { flex: 0 0 auto; }
.thead .c-drop::before { content: "/"; margin: 0 1px 0 2px; }
.tbody .tr { min-height: 57px; padding: 5px 0; }
.tbody .tr:hover { background: var(--g002); }
.c-fav { flex: 0 0 50px; padding-left: 16px; }
.c-name { flex: 0 0 calc(100% - 60px); min-width: 0; }
.c-reg, .c-lv, .c-form { display: none; }
.tbody .c-drop {
  position: absolute; left: 106px; top: 30px; width: calc(100% - 120px); font-size: 13px; line-height: 20px;
  color: var(--drop-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.c-reg .nw { white-space: nowrap; }
.btn-item { display: flex; align-items: flex-start; width: 100%; text-align: left; }
.btn-item img { flex: 0 0 46px; width: 46px; height: 46px; margin-right: 10px; object-fit: contain; }
.btn-item .nm { min-width: 0; font-size: 15px; line-height: 22px; color: var(--b093); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-item:hover .nm { text-decoration: underline; }
.nodata { padding: 100px 16px; font-size: 15px; color: var(--b068); text-align: center; border-top: 1px solid var(--g040); }

/* 分頁 */
.pager { display: none; }
.pager-m { margin-top: 30px; text-align: center; color: var(--b045); font-size: 15px; }
.pager-m .row1 { display: flex; justify-content: center; }
.pager-m .row1 button { width: 68px; height: 36px; margin: 0 4px; border: 1px solid var(--g010); border-radius: 4px; font-size: 14px; color: var(--b068); }
.pager-m .row1 button:disabled { color: var(--b045); cursor: default; }
.pager-m .row2 { display: flex; justify-content: center; align-items: center; margin-top: 16px; }
.pager-m select { min-width: 64px; height: 28px; padding: 0 6px; border: 0; background: transparent; color: var(--b093); font-size: 15px; }
.pager-m select option { background: var(--panel); color: var(--b093); }
.pager-m .sep { width: 1px; height: 16px; background: var(--g012); margin: 0 10px; }
.pager-m strong { font-weight: 400; color: var(--b093); }

/* ---------- 明細彈窗 ---------- */
.dw { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; padding: 40px 16px; background: rgba(0,0,0,.8); z-index: 9100009; display: none; }
.dw.is-active { display: block; }
.dlg { position: relative; max-height: 90vh; max-height: 90dvh; overflow-y: auto; border-radius: 5px; font-size: 14px; background: var(--panel); color: var(--b093); outline: none; }
.dlg-title { position: relative; height: 62px; padding-top: 21px; margin: 0 35px 0 20px; display: flex; align-items: flex-start; color: var(--b068); }
.dlg-title h2 { font-size: 18px; line-height: 22px; color: var(--b093); }
.btn-back { position: relative; width: 11px; height: 22px; margin-right: 8px; }
.btn-back::after { content: ""; position: absolute; left: 3px; top: 5px; width: 12px; height: 12px; border: solid var(--b068); border-width: 0 1px 1px 0; transform: rotate(135deg); }
.btn-share { width: 22px; height: 22px; margin: 0 0 0 4px; color: var(--b068); }
.btn-share svg { width: 22px; height: 22px; }
.btn-close { position: absolute; top: 12px; right: -24px; width: 35px; height: 35px; }
.btn-close::before, .btn-close::after { content: ""; position: absolute; left: 50%; top: 50%; width: 19px; height: 1px; margin-left: -9.5px; background: var(--b068); }
.btn-close::before { transform: rotate(45deg); }
.btn-close::after { transform: rotate(-45deg); }
.dlg-body { position: relative; padding: 0 10px 10px 20px; margin-right: 6px; }
.dcol section { margin-bottom: 10px; }
.summary { position: relative; display: flow-root; border-top: 1px solid var(--g040); padding: 16px 0 7px; }
.summary .thumb { float: left; width: 50px; height: 50px; margin-right: 12px; border: 1px solid var(--g012); object-fit: contain; }
.summary .mname { margin-top: 6px; padding-right: 40px; font-size: 16px; line-height: 22px; color: var(--text); word-break: break-all; }
.summary .mname strong { font-weight: 400; }
.ability { font-size: 14px; color: var(--b045); display: flex; flex-wrap: wrap; }
.ability span { position: relative; padding-left: 5px; margin-right: 5px; }
.ability span:first-child { padding-left: 0; }
.ability span + span::before { content: ""; position: absolute; left: 0; top: 4px; width: 1px; height: 14px; background: var(--sep); }
.summary .star-btn { position: absolute; right: 12px; top: 23px; }
.dsec > header { display: flex; align-items: center; height: 46px; padding: 0 4px 0 16px; background: var(--g004); border-top: 1px solid var(--g008); color: var(--b068); white-space: nowrap; }
.dsec > header h3 { font-size: 14px; font-weight: 400; }
.btn-folder { position: relative; width: 35px; height: 35px; margin-left: auto; }
.btn-folder::after { content: ""; position: absolute; left: 13px; top: 15px; width: 9px; height: 9px; border: solid var(--b068); border-width: 0 1px 1px 0; transform: rotate(-135deg); }
.dsec.is-folded .btn-folder::after { transform: rotate(45deg); top: 10px; }
.dsec.is-folded > article { display: none; }
.dsec > article { padding: 16px 16px 0; }
.kv li, .drops li { display: flex; padding-bottom: 13px; }
.kv .k, .drops .k { flex: 0 0 103px; width: 103px; color: var(--b068); text-align: left; font-size: 14px; }
.kv .v, .drops .v { flex: 1 1 auto; min-width: 0; color: var(--b093); }
.drops .v p { margin-bottom: 10px; line-height: 1.5; }
.item-link { text-align: left; }
.item-link strong { font-weight: 400; color: var(--link); text-decoration: underline; }
.cat-key { display: inline-flex; align-items: flex-start; }
.cat-key::before { content: ""; flex: 0 0 auto; width: 6px; height: 6px; margin: 5px 8px 0 2px; border: solid var(--b093); border-width: 0 2px 2px 0; transform: rotate(50deg) skew(10deg); }
.drop-cat.is-hidden .cat-key::before { transform: rotate(-40deg) skew(10deg); margin-top: 7px; }
.drop-cat.is-hidden .v { display: none; }
.drops .no-data { color: var(--b093); padding-bottom: 16px; }

/* ---------- 浮動 ---------- */
.theme-toggle {
  position: fixed; left: 16px; bottom: 16px; z-index: 100; height: 40px; padding: 0 14px 0 8px; border-radius: 22px;
  display: flex; align-items: center; background: #434343; border: 1px solid #585858; box-shadow: 0 2px 4px rgba(0,0,0,.25); opacity: .95;
}
.theme-toggle svg { width: 26px; height: 26px; }
.theme-toggle span { margin-left: 2px; font-size: 14px; font-weight: 700; letter-spacing: -.7px; color: rgba(255,255,255,.6); }
:root[data-theme="dark"] .theme-toggle span { color: var(--point-text); }
.to-top {
  position: fixed; right: 16px; bottom: 16px; z-index: 100; width: 33px; height: 33px; border-radius: 4px;
  border: 1px solid var(--g008); background: var(--g004hex); color: var(--b068); display: flex; align-items: center; justify-content: center;
}
.to-top svg { width: 13px; height: 17px; }
.toast {
  position: fixed; left: 50%; bottom: 16px; z-index: 9999999; transform: translateX(-50%);
  width: 650px; max-width: calc(100% - 32px); min-height: 56px; padding: 16px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center; text-align: center;
  background: var(--toast-bg); color: var(--on-toast); font-size: 15px; pointer-events: none;
}
.toast.show { animation: toast-in .2s ease-out; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
@media (prefers-reduced-motion: reduce) { .toast.show { animation: none; } }

/* ---------- 分頁(道具/魔法/怪物/製作) ---------- */
.gi-tabs { display: flex; padding: 12px 16px 0; }
.gi-tabs button { flex: 1 1 0; height: 44px; border: 1px solid var(--g012); border-left-width: 0; background: var(--g004); color: var(--b068); font-size: 15px; }
.gi-tabs button:first-child { border-left-width: 1px; }
.gi-tabs button[aria-selected="true"] { background: var(--bg); color: var(--point-text); border-top-color: var(--point); border-bottom-color: transparent; }

/* ---------- 各分頁欄位 ---------- */
.c-sub, .c-cls, .c-cost, .c-dur, .c-npc { display: none; }
.thead .c-sub, .thead .c-cls, .thead .c-cost, .thead .c-dur, .thead .c-npc { display: none; }
.btn-item .prob { flex: 0 0 auto; margin-left: 8px; font-size: 13px; line-height: 22px; color: var(--b045); }
.btn-item .cnt { color: var(--b068); }
.c-mats { display: flex; flex-wrap: wrap; gap: 5px; }
.tbl[data-tab="craft"] .tbody .tr { flex-wrap: wrap; }
.tbl[data-tab="craft"] .tbody .c-mats { flex: 0 0 100%; padding: 2px 16px 6px 106px; }
.tbl[data-tab="craft"] .thead .c-mats { flex: 0 0 auto; }
.mat { position: relative; flex: 0 0 auto; width: 42px; height: 42px; border: 1px solid var(--g012); border-radius: 2px; background: var(--g004); }
.mat img { width: 40px; height: 40px; object-fit: contain; }
.mat .amt, .mat .en { position: absolute; font-size: 11px; line-height: 13px; color: #FFFFFF; text-shadow: 0 0 2px #000, 0 0 2px #000; pointer-events: none; }
.mat .amt { right: 2px; bottom: 1px; }
.mat .en { left: 2px; top: 1px; }
.mat:disabled { cursor: default; }
.summary .enh-sel { height: 22px; margin: 6px 6px 0 0; padding: 0 2px; border: 0; background: transparent; color: var(--b068); font-size: 14px; float: left; }
.summary .enh-sel option { background: var(--panel); color: var(--b093); }
.kv em { font-style: normal; color: var(--point-text); }
.kv .sep { display: block; height: 0; padding: 0; margin: 0 0 13px; border-top: 1px solid var(--g012); }
.kv .v p { margin: 0 0 6px; }
.src-link { text-align: left; }
.src-link strong { font-weight: 400; color: var(--link); text-decoration: underline; }

/* ================================================= 桌機 ≥960 */
@media (min-width: 960px) {

      return a.length - b.length || (lc(b).indexOf(k) === 0) - (lc(a).indexOf(k) === 0) || a.localeCompare(b, 'zh-Hant');
    });
    return out.slice(0, 10);
  }
  function setSugOpen(open) {
    sugOpen = open && sugItems.length > 0;
    sugUl.hidden = !sugOpen;
    input.setAttribute('aria-expanded', sugOpen ? 'true' : 'false');
    if (!sugOpen) { sugIdx = -1; kbSel = false; paintSug(); }
  }
  function paintSug() {
    var lis = sugUl.children;
    for (var i = 0; i < lis.length; i++) {
      lis[i].classList.toggle('focus', i === sugIdx);
      lis[i].setAttribute('aria-selected', i === sugIdx ? 'true' : 'false');
    }
    if (sugIdx >= 0) input.setAttribute('aria-activedescendant', 'sug' + sugIdx); else input.removeAttribute('aria-activedescendant');
  }
  function loadSuggest(kw) {
    loadedKw = kw;
    sugItems = suggest(kw);
    sugIdx = -1;
    sugUl.textContent = '';
    var k = lc(kw);
    sugItems.forEach(function (s, i) {
      var li = el('li'), at = lc(s).indexOf(k), nb = function (t) { return t.replace(/ /g, ' '); };
      li.id = 'sug' + i;
      li.setAttribute('role', 'option');
      li.setAttribute('data-idx', i);
      if (at >= 0) {
        li.appendChild(document.createTextNode(nb(s.slice(0, at))));
        li.appendChild(el('mark', '', nb(s.slice(at, at + kw.length))));
        li.appendChild(document.createTextNode(nb(s.slice(at + kw.length))));
      } else li.textContent = nb(s);
      sugUl.appendChild(li);
    });
    setSugOpen(document.activeElement === input);
  }
  function clearSuggest() { sugItems = []; sugUl.textContent = ''; setSugOpen(false); }
  function moveSug(dir) {
    var n = sugItems.length;
    if (!n) return;
    var next = sugIdx < 0 || !sugOpen ? (dir > 0 ? 0 : n - 1) : sugIdx + dir;
    if (next < 0 || next >= n) { setSugOpen(false); return; }
    setSugOpen(true);
    sugIdx = next;
    kbSel = true;
    paintSug();
    input.value = sugItems[next];
    toggleClear();
  }
  function kbExact() { return sugOpen && sugIdx >= 0 && kbSel; } // 鍵盤選中建議項 → 精確搜尋
  function submit(exact) {
    var q = input.value.trim();
    clearTimeout(blurTimer);
    setSugOpen(false);
    nav({ detail: '', query: q, exactsearch: exact ? 'true' : 'false', page: '1', out: '', in: '' });
  }
  input.addEventListener('input', function () {
    var kw = input.value.trim();
    toggleClear();
    if (!kw) { loadedKw = ''; clearSuggest(); return; }
    if (kw !== loadedKw) loadSuggest(kw);
  });
  input.addEventListener('focus', function () {
    clearTimeout(blurTimer);
    var kw = input.value.trim();
    if (kw && kw !== loadedKw) loadSuggest(kw);
    else setSugOpen(true);
  });
  input.addEventListener('blur', function () { blurTimer = setTimeout(function () { setSugOpen(false); }, 150); });
  input.addEventListener('keydown', function (e) {
    if (e.isComposing || e.keyCode === 229) return; // IME 組字中:方向鍵/Tab/Esc/Enter 都交給輸入法
    if (e.key === 'Escape' || e.key === 'Esc') {
      e.preventDefault(); // 擋掉 type=search 原生的 Esc 清空
      if (sugOpen || sugIdx >= 0) e.stopPropagation();
      if (loadedKw) input.value = loadedKw;
      toggleClear();
      setSugOpen(false);
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      var exact = kbExact();
      btnSearch.classList.add('no-ring'); // 官方送出時焦點移到放大鏡;程式移焦不畫外框
      btnSearch.focus();
      submit(exact);
      return;
    }
    if (e.key === 'ArrowDown' || e.key === 'Down') { if (sugItems.length) { e.preventDefault(); moveSug(1); } return; }
    if (e.key === 'ArrowUp' || e.key === 'Up') { if (sugItems.length) { e.preventDefault(); moveSug(-1); } return; }
    if (e.key === 'Tab' && sugOpen) { e.preventDefault(); moveSug(e.shiftKey ? -1 : 1); }
  });
  btnSearch.addEventListener('blur', function () { btnSearch.classList.remove('no-ring'); });
  sugUl.addEventListener('mousedown', function (e) { e.preventDefault(); }); // 不讓輸入框失焦
  sugUl.addEventListener('mousemove', function (e) {
    var li = e.target.closest('li');
    if (!li) return;
    var i = parseInt(li.getAttribute('data-idx'), 10);
    if (i !== sugIdx) { sugIdx = i; kbSel = false; paintSug(); }
  });
  sugUl.addEventListener('click', function (e) {
    var li = e.target.closest('li');
    if (!li) return;
    input.value = sugItems[parseInt(li.getAttribute('data-idx'), 10)];
    submit(true);
    input.blur();
  });
  $('autoSuggest').addEventListener('submit', function (e) {
    e.preventDefault();
    submit(kbExact());
  });
  btnClear.addEventListener('click', function () {
    loadedKw = '';
    input.value = '';
    clearSuggest();
    toggleClear();
    input.focus();
    nav({ detail: '', query: '', exactsearch: 'false', page: '1', out: '', in: '' });
  });
  $('homeLink').addEventListener('click', function (e) {
    e.preventDefault();
    navReset({});
  });

  // ================================================= 明細
  var dw = $('dw'), dlg = $('dlg'), dlgBody = $('dlgBody'), detailOpen = false, detailKey = '', lastFocus = null;
  function section(title, cls) {
    var s = el('section', 'dsec' + (cls ? ' ' + cls : '')), h = el('header'), f = el('button', 'btn-folder');
    h.appendChild(el('h3', '', title));
    f.type = 'button';
    f.setAttribute('aria-expanded', 'true');
    f.setAttribute('aria-label', title);
    h.appendChild(f);
    s.appendChild(h);
    var a = el('article');
    s.appendChild(a);
    return { sec: s, art: a };
  }
  function kvRow(ul, k, v) {
    var li = el('li');
    li.appendChild(el('span', 'k', k));
    var val = el('div', 'v');
    if (typeof v === 'string' || typeof v === 'number') val.textContent = v;
    else if (Array.isArray(v)) v.forEach(function (x) { val.appendChild(typeof x === 'string' ? el('p', '', x) : x); });
    else val.appendChild(v);
    li.appendChild(val);
    ul.appendChild(li);
    return val;
  }
  function linkP(text, attr, val) {
    var p = el('p'), b = el('button', 'src-link');
    b.type = 'button';
    b.setAttribute(attr, val);
    b.appendChild(el('strong', '', text));
    p.appendChild(b);
    return p;
  }
  function summaryOf(img, name, abil, tab, key) {
    var sum = el('section', 'summary');
    sum.appendChild(thumb(img, 'thumb'));
    var nm = el('p', 'mname');
    nm.appendChild(el('strong', '', name));
    sum.appendChild(nm);
    var ab = el('p', 'ability');
    abil.forEach(function (t) { ab.appendChild(el('span', '', t)); });
    sum.appendChild(ab);
    sum.appendChild(starBtn(tab, key, 'detail-star'));
    return { sum: sum, nm: nm };
  }
  function buildMonster(m) {
    var left = el('div', 'dcol'), right = el('div', 'dcol');
    left.appendChild(summaryOf(m.img, m.name, ['等級 ' + m.level].concat(m.undead ? ['不死系'] : []), 'monster', m.key).sum);

    var info = section('怪物資訊'), kv = el('ul', 'kv');
    kvRow(kv, '大小', m.big ? '大型怪物' : '小型怪物');
    if (m.regionNames.length) kvRow(kv, '出現地區', m.regionNames.map(function (n) { return el('div', '', n); }));
    info.art.appendChild(kv);
    left.appendChild(info.sec);

    var dsec = section('掉落道具', 'drops-sec'), ul = el('ul', 'drops');
    if (!m.drops.length) ul.appendChild(el('li', 'no-data', '-'));
    m.drops.forEach(function (c) {
      var li2 = el('li', 'drop-cat'), k = el('button', 'k cat-key', c.cat), v2 = el('div', 'v');
      k.type = 'button';
      k.setAttribute('aria-expanded', 'true');
      c.items.forEach(function (it) {
        var p = el('p'), b = el('button', 'item-link');
        b.type = 'button';
        b.setAttribute('data-item', it);
        b.appendChild(el('strong', '', it));
        p.appendChild(b);
        v2.appendChild(p);
      });
      li2.appendChild(k);
      li2.appendChild(v2);
      ul.appendChild(li2);
    });
    dsec.art.appendChild(ul);
    right.appendChild(dsec.sec);
    dlgBody.appendChild(left);
    dlgBody.appendChild(right);
  }
  function enhVal(base, en, sign) { // 攻擊力/防禦力後面的 (+N)
    var f = document.createDocumentFragment();
    f.appendChild(document.createTextNode(base));
    if (en != null) f.appendChild(el('em', '', '(' + sign + en + ')'));
    return f;
  }
  function buildItem(it) {
    var col = el('div', 'dcol'), flags = [it.noTrade ? '交易X' : '交易O', it.noDel ? '刪除X' : '刪除O'];
    var s = summaryOf(it.img, it.name, flags, 'item', it.id), en = it.safe >= 0 ? 0 : null;
    col.appendChild(s.sum);
    var info = section('道具資訊'), kv = el('ul', 'kv');
    function paint() {
      kv.textContent = '';
      kvRow(kv, '種類', it.kind);
      if (it.dmg) {
        var d = document.createDocumentFragment();
        d.appendChild(enhVal(it.dmg[0] + (en || 0), en, '+'));
        d.appendChild(document.createTextNode('/'));
        d.appendChild(enhVal(it.dmg[1] + (en || 0), en, '+'));
        kvRow(kv, '攻擊力(小型/大型)', d);
      }
      if (it.ac != null) kvRow(kv, '防禦力', enhVal(it.ac + (en || 0), en, '+'));
      if (it.w2h != null) kvRow(kv, '單手/雙手', it.w2h ? '雙手' : '單手');
      if (it.cls) kvRow(kv, '職業', it.cls.length ? it.cls.map(function (i) { return CLS[i]; }).join(', ') : '全部');
      kvRow(kv, '重量', it.w);
      if (it.mat) kvRow(kv, '材質', it.mat);
      if (it.safe != null) kvRow(kv, '強化', it.safe >= 0 ? '+' + it.safe + '前可安全強化' : '無法強化');
      if (it.opts.length || it.desc) kv.appendChild(el('li', 'sep'));
      if (it.opts.length) kvRow(kv, '選項', it.opts.slice());
      if (it.desc) kvRow(kv, '說明', it.desc);
    }
    if (en != null) { // 強化值下拉(同官網 +0 ∨):武器攻擊力/防具防禦力跟著 +N(同遊戲內道具說明)
      var sel = el('select', 'enh-sel');
      sel.setAttribute('aria-label', '強化');
      for (var i = 0; i <= it.safe + 5; i++) { var o = el('option', '', '+' + i); o.value = i; sel.appendChild(o); }
      sel.addEventListener('change', function () { en = parseInt(sel.value, 10); paint(); });
      s.sum.insertBefore(sel, s.nm);
    }
    paint();
    info.art.appendChild(kv);
    col.appendChild(info.sec);

    var src = section('獲得處&用途'), kv2 = el('ul', 'kv'), got = [];
    if (it.src.mob) got.push(linkP('怪物', 'data-go', 'mob|' + it.id));
    if (it.src.craft) { got.push(linkP('製作', 'data-go', 'out|' + it.id)); got = got.concat(it.src.craft); }
    if (got.length || (!it.src.shop && !it.src.etc)) kvRow(kv2, '獲得處', got.length ? got : '-');
    if (it.src.shop) kvRow(kv2, '商店', it.src.shop.slice());
    if (it.src.etc) kvRow(kv2, '其他', it.src.etc.slice());
    if (it.use) kvRow(kv2, '用途', [linkP('製作', 'data-go', 'in|' + it.id)]);
    src.art.appendChild(kv2);
    col.appendChild(src.sec);
    dlgBody.appendChild(col);
  }
  function buildSpell(sp) {
    var col = el('div', 'dcol');
    col.appendChild(summaryOf(sp.img, sp.name, [sp.align, sp.stage], 'spell', sp.key).sum);
    var info = section('魔法資訊'), kv = el('ul', 'kv');
    kvRow(kv, '職業', sp._clsTxt);
    kvRow(kv, '消耗/材料', sp.cost);
    kvRow(kv, '持續時間', sp.dur);
    if (sp.tgt) kvRow(kv, '對象', sp.tgt);
    kvRow(kv, '學習等級', sp.lv);
    if (sp.desc) kvRow(kv, '說明', sp.desc);
    info.art.appendChild(kv);
    col.appendChild(info.sec);
    var learn = section('學習方法'), kv2 = el('ul', 'kv'), bk = ITBYID[sp.book];
    kvRow(kv2, '魔法書', bk ? [linkP(bk.name, 'data-detail', 'item_' + bk.id)] : '-');
    if (sp.spot) kvRow(kv2, '學習地點', sp.spot.slice());
    learn.art.appendChild(kv2);
    col.appendChild(learn.sec);
    dlgBody.appendChild(col);
  }
  function buildDetail(d) {
    dlgBody.textContent = '';
    dlg.classList.toggle('one', d.type !== 'monster');
    if (d.type === 'monster') buildMonster(BYKEY[d.key]);
    else if (d.type === 'item') buildItem(ITBYID[d.key]);
    else buildSpell(SPBYKEY[d.key]);
    syncCatKeys();
  }
  function syncCatKeys() { // 桌機分類名不可點 → 不給 Tab 停
    var ks = dlgBody.querySelectorAll('.cat-key');
    for (var i = 0; i < ks.length; i++) ks[i].tabIndex = mqMobile.matches ? 0 : -1;
  }
  function renderDetail(st) {
    if (!st.detail) {
      if (!detailOpen) return;
      detailOpen = false;
      detailKey = '';
      dw.classList.remove('is-active');
      lockScroll();
      var lf = lastFocus;
      lastFocus = null;
      if (lf && document.contains(lf)) lf.focus();
      else if (lf && lf.getAttribute && lf.getAttribute('data-detail')) { // 清單重畫過,找同一列的新按鈕
        var k = lf.getAttribute('data-detail'), btns = tbody.querySelectorAll('[data-detail]');
        for (var i = 0; i < btns.length; i++) if (btns[i].getAttribute('data-detail') === k) { btns[i].focus(); break; }
      }
      return;
    }
    var dk = st.detail.type + '_' + st.detail.key;
    if (detailKey !== dk) {
      buildDetail(st.detail);
      detailKey = dk;
      dlg.scrollTop = 0;
      dlgBody.scrollTop = 0;
    }
    if (!detailOpen) {
      detailOpen = true;
      if (!lastFocus) lastFocus = document.activeElement;
      dw.classList.add('is-active');
      lockScroll();
      dlg.focus();
    }
  }
  function updateDetailStar() {
    var s = dlgBody.querySelector('.detail-star');
    if (!s) return;
    var fk = s.getAttribute('data-fav'), p = fk.indexOf(':'), on = isFav(fk.slice(0, p), fk.slice(p + 1));
    s.classList.toggle('on', on);
    s.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  function closeDetail() { nav({ detail: '' }); }
  $('dlgClose').addEventListener('click', closeDetail);
  $('dlgBack').addEventListener('click', function () {
    if (!useHash && histDepth() > 0) history.back(); else closeDetail();
  });
  var downOnBackdrop = false; // 在彈窗內按下、拖到遮罩放開(選字)不算點遮罩
  dw.addEventListener('pointerdown', function (e) { downOnBackdrop = e.target === dw; });
  dw.addEventListener('click', function (e) {
    if (e.target === dw && downOnBackdrop) closeDetail();
    downOnBackdrop = false;
  });
  dlgBody.addEventListener('click', function (e) {
    var it = e.target.closest('[data-item]');
    if (it) { // 怪物掉落道具=精確搜尋會掉它的怪(老闆 2026-09-29 拍板)
      lastFocus = null;
      navReset({ query: it.getAttribute('data-item'), exactsearch: 'true', page: '1' });
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    var dd = e.target.closest('[data-detail]');
    if (dd) { nav({ detail: dd.getAttribute('data-detail') }); return; }
    var go = e.target.closest('[data-go]');
    if (go) { // 道具明細:獲得處怪物/製作、用途製作(同官網跳到該分頁)
      var v = go.getAttribute('data-go'), p = v.indexOf('|'), kind = v.slice(0, p), x = ITBYID[v.slice(p + 1)];
      lastFocus = null;
      if (kind === 'mob') navReset({ query: x.q || x.name, exactsearch: 'true', page: '1' });
      else navReset({ tab: 'craft', query: x.name, page: '1', out: kind === 'out' ? x.id : '', in: kind === 'in' ? x.id : '' });
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    var f = e.target.closest('.btn-folder');
    if (f) {
      var sec = f.closest('.dsec'), folded = sec.classList.toggle('is-folded');
      f.setAttribute('aria-expanded', folded ? 'false' : 'true');
      return;
    }
    var k = e.target.closest('.cat-key');
    if (k && mqMobile.matches) {
      var hidden = k.parentNode.classList.toggle('is-hidden');
      k.setAttribute('aria-expanded', hidden ? 'false' : 'true');
    }
  });
  $('dlgShare').addEventListener('click', function () {
    var url = location.href;
    if (mqMobile.matches && navigator.share) {
      navigator.share({ title: document.title, url: url }).catch(function () {});
      return;
    }
    copyText(url).then(function () { toast('已複製地址。'); }, function () { toast(url); });
  });
  function copyText(t) {
    function legacy() {
      return new Promise(function (res, rej) {
        var ta = el('textarea');
        ta.value = t;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        if (ok) res(); else rej();
      });
    }
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).catch(legacy);
    return legacy();
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      if (detailOpen) { e.preventDefault(); closeDetail(); }
      else if (filterOpen) { setFilter(false); $('btnFilter').focus(); }
      return;
    }
    if (e.key === 'Tab' && (detailOpen || filterOpen)) { // 焦點鎖在彈窗內
      var box = detailOpen ? dlg : filterEl;
      var f = Array.prototype.filter.call(box.querySelectorAll('button, input, select, a[href], [tabindex]'), function (x) { return !x.disabled && x.tabIndex >= 0 && x.getClientRects().length > 0; });
      if (!f.length) return;
      var first = f[0], lastEl = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === box)) { e.preventDefault(); lastEl.focus(); }
      else if (!e.shiftKey && document.activeElement === lastEl) { e.preventDefault(); first.focus(); }
      else if (!box.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    }
  });

  // ================================================= 主題/回頂/toast
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    $('themeTxt').textContent = t === 'dark' ? 'ON' : 'OFF';
    $('btnTheme').setAttribute('aria-pressed', t === 'dark' ? 'true' : 'false');
  }
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
  $('btnTheme').addEventListener('click', function () {
    var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    sset(THEME_KEY, t);
    applyTheme(t);
  });
  function onScheme() {
    var t = sget(THEME_KEY);
    if (t !== 'dark' && t !== 'light') applyTheme(mqDark.matches ? 'dark' : 'light');
  }
  if (mqDark.addEventListener) mqDark.addEventListener('change', onScheme); else if (mqDark.addListener) mqDark.addListener(onScheme);

  var btnTop = $('btnTop');
  function onScroll() { btnTop.hidden = window.pageYOffset < 200; }
  window.addEventListener('scroll', onScroll, { passive: true });
  btnTop.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });

  var toastEl = $('toast'), toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    toastEl.classList.remove('show');
    void toastEl.offsetWidth;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 3000);
  }

  render(true);
  onScroll();
})();
